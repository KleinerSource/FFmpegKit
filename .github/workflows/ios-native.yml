name: iOS native source build

on:
  workflow_dispatch:
    inputs:
      ffmpeg_repository:
        description: '包含锁定增强提交的 FFmpeg 仓库，格式 owner/repo'
        required: false
        default: KleinerSource/FFmpeg
        type: string
      ksplayer_repository:
        description: 'KSPlayer 仓库，workflow 从 main 拉取最新版本，格式 owner/repo'
        required: true
        default: KleinerSource/KSPlayer
        type: string
  workflow_call:
    inputs:
      ffmpeg_repository:
        description: '包含锁定增强提交的 FFmpeg 仓库，格式 owner/repo'
        required: false
        default: KleinerSource/FFmpeg
        type: string
      ksplayer_repository:
        description: 'KSPlayer 仓库，workflow 从 main 拉取最新版本，格式 owner/repo'
        required: false
        default: KleinerSource/KSPlayer
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: FFmpegKit
    steps:
      - uses: actions/checkout@v4
        with:
          path: FFmpegKit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read FFmpeg revision and KSPlayer branch
        id: revisions
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open('iOSNative/sources.lock.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'FFmpeg={lock["sources"]["FFmpeg"]["commit"]}', file=output)
              print(f'KSPlayer_BRANCH={lock["sources"]["KSPlayer"].get("branch", "main")}', file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ffmpeg_repository }}
          ref: ${{ steps.revisions.outputs.FFmpeg }}
          token: ${{ secrets.COMPONENTS_TOKEN || github.token }}
          path: FFmpeg
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ksplayer_repository }}
          ref: ${{ steps.revisions.outputs.KSPlayer_BRANCH }}
          token: ${{ secrets.COMPONENTS_TOKEN || github.token }}
          path: KSPlayer
      - name: Resolve checked out KSPlayer revision
        id: ksplayer
        run: |
          revision="$(git -C "$GITHUB_WORKSPACE/KSPlayer" rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Install native toolchain
        run: |
          brew install autoconf automake libtool pkg-config cmake meson ninja nasm texinfo cocoapods
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
      - name: Check build source integrity
        run: python3 -m unittest discover -s iOSNative -p test_build.py -v
      - name: Compute source and toolchain cache key
        id: cache-key
        run: echo "key=$(python3 iOSNative/build.py cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            FFmpegKit/build/ios-native/pods/FFmpegKit/Frameworks
            FFmpegKit/build/ios-native/build-complete.json
          key: ios-native-${{ steps.cache-key.outputs.key }}
      - uses: actions/cache/restore@v4
        id: player-validation-cache
        with:
          path: FFmpegKit/build/ios-native/KSPlayerValidation
          key: ios-player-validation-${{ runner.os }}-${{ steps.cache-key.outputs.key }}-${{ steps.revisions.outputs.FFmpeg }}-${{ steps.ksplayer.outputs.revision }}-${{ hashFiles('FFmpegKit/iOSNative/build.py', 'FFmpegKit/iOSNative/sources.lock.json', 'FFmpegKit/FFmpegKit.podspec', 'FFmpegKit/Libass.podspec', 'FFmpegKit/Sources/FFmpegKit/**', 'FFmpegKit/LICENSE') }}
      - name: Export fixed sources
        run: python3 iOSNative/build.py prepare
      - name: Build device and simulator libraries
        run: python3 iOSNative/build.py build --jobs 3
      - name: Save compiled libraries before player validation
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            FFmpegKit/build/ios-native/pods/FFmpegKit/Frameworks
            FFmpegKit/build/ios-native/build-complete.json
          key: ios-native-${{ steps.cache-key.outputs.key }}
      - name: Verify actual color shader functions
        run: python3 -m unittest discover -s iOSNative/tests -p test_color_reference.py -v
      - name: Validate CocoaPods compilation
        if: steps.player-validation-cache.outputs.cache-hit != 'true'
        run: |
          pod lib lint build/ios-native/pods/KSPlayer/KSPlayer.podspec --platforms=ios --allow-warnings --skip-tests --include-podspecs='build/ios-native/pods/*/*.podspec'
      - name: Run simulator XCTest
        if: steps.player-validation-cache.outputs.cache-hit != 'true'
        working-directory: KSPlayer
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -scheme KSPlayer -destination "platform=iOS Simulator,id=$device" -resultBundlePath ../FFmpegKit/build/ios-native/KSPlayerTests.xcresult test CODE_SIGNING_ALLOWED=NO
      - name: Compile device Release
        if: steps.player-validation-cache.outputs.cache-hit != 'true'
        working-directory: KSPlayer
        run: xcodebuild -scheme KSPlayer -configuration Release -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
      - name: Record successful component compilation
        if: steps.player-validation-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/ios-native/KSPlayerValidation
          printf 'ffmpeg=%s\nksplayer=%s\n' \
            '${{ steps.revisions.outputs.FFmpeg }}' '${{ steps.ksplayer.outputs.revision }}' \
            > build/ios-native/KSPlayerValidation/validated.txt
      - uses: actions/cache/save@v4
        if: steps.player-validation-cache.outputs.cache-hit != 'true'
        with:
          path: FFmpegKit/build/ios-native/KSPlayerValidation
          key: ios-player-validation-${{ runner.os }}-${{ steps.cache-key.outputs.key }}-${{ steps.revisions.outputs.FFmpeg }}-${{ steps.ksplayer.outputs.revision }}-${{ hashFiles('FFmpegKit/iOSNative/build.py', 'FFmpegKit/iOSNative/sources.lock.json', 'FFmpegKit/FFmpegKit.podspec', 'FFmpegKit/Libass.podspec', 'FFmpegKit/Sources/FFmpegKit/**', 'FFmpegKit/LICENSE') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-build
          path: |
            FFmpegKit/build/ios-native/pods/FFmpegKit/native-versions.json
            FFmpegKit/build/ios-native/pods/FFmpegKit/Licenses
            FFmpegKit/build/ios-native/pods/FFmpegKit/Frameworks
            FFmpegKit/build/ios-native/KSPlayerTests.xcresult
          retention-days: 7
